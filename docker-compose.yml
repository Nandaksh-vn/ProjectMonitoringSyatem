services:
  db:
    image: mysql:8.0
    container_name: infrawatch-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: infrawatchdb
    ports:
      # Host port 3307 avoids conflict with any locally-running MySQL on 3306
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - infrawatch-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: ./backend
    container_name: infrawatch-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:mysql://db:3306/infrawatchdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      - SPRING_DATASOURCE_DRIVER=com.mysql.cj.jdbc.Driver
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-root}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-root}
      - SPRING_JPA_DIALECT=org.hibernate.dialect.MySQLDialect
      - JWT_SECRET=${JWT_SECRET:-infrawatch-local-dev-secret-do-not-use-in-production-change-me}
      - ML_SERVICE_URL=http://ml-service:8000
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
      ml-service:
        condition: service_started
    networks:
      - infrawatch-net

  ml-service:
    build: ./ml-service
    container_name: infrawatch-ml
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - ENVIRONMENT=production
    networks:
      - infrawatch-net

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the bundle at build time. Must be reachable from the
        # browser, so it stays on the published host port, not a Compose
        # service name.
        VITE_ML_API_URL: ${VITE_ML_API_URL:-http://localhost:8000}
    container_name: infrawatch-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - infrawatch-net
    restart: unless-stopped

volumes:
  db_data:

networks:
  infrawatch-net:
    driver: bridge
