server:
  # Render (and most PaaS) injects a dynamic PORT and routes traffic to exactly
  # that port, so PORT must win. SERVER_PORT is kept as a secondary override and
  # 8080 remains the local default.
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /api

spring:
  application:
    name: infrawatch-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/infrawatchdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
  jpa:
    database-platform: ${SPRING_JPA_DIALECT:org.hibernate.dialect.MySQLDialect}
    hibernate:
      ddl-auto: none
    defer-datasource-initialization: true
    show-sql: false
  sql:
    init:
      mode: always
      continue-on-error: false
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:10MB}
      max-request-size: ${MAX_UPLOAD_SIZE:10MB}

ml:
  service:
    url: ${ML_SERVICE_URL:http://localhost:8000}
    connect-timeout-ms: ${ML_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${ML_READ_TIMEOUT_MS:15000}

jwt:
  secret: ${JWT_SECRET:infrawatch-local-dev-secret-do-not-use-in-production-change-me}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

infrawatch:
  alert:
    thresholds:
      progress-gap: ${THRESHOLD_PROGRESS_GAP:10.0}
      cost-escalation: ${THRESHOLD_COST_ESCALATION:10.0}
      high-risk: ${THRESHOLD_HIGH_RISK:70.0}
      cost-overrun-probability: ${THRESHOLD_COST_OVERRUN_PROB:0.60}
      time-overrun-probability: ${THRESHOLD_TIME_OVERRUN_PROB:0.60}
      predicted-delay-months: ${THRESHOLD_DELAY_MONTHS:3.0}
  scheduling:
    enabled: ${SCHEDULING_ENABLED:true}
    rules-initial-delay-ms: ${SCHED_RULES_INITIAL_DELAY_MS:60000}
    rules-interval-ms: ${SCHED_RULES_INTERVAL_MS:1800000}
    prediction-initial-delay-ms: ${SCHED_PREDICTION_INITIAL_DELAY_MS:120000}
    prediction-interval-ms: ${SCHED_PREDICTION_INTERVAL_MS:3600000}

app:
  auth:
    # Public self-registration is off by default. Turn on only for local demos.
    allow-self-registration: ${ALLOW_SELF_REGISTRATION:false}
  cors:
    # Comma-separated list of exact browser origins. Never use "*" with credentials.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:5173}
  mail:
    sender-name: InfraWatch AI
    from: ${MAIL_USERNAME:noreply@infrawatch.ai}