server {
    # Listen on both stacks: inside the container `localhost` resolves to ::1
    # first, so an IPv4-only listener makes health checks fail with
    # "connection refused".
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable and can be cached aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy the Spring Boot backend, which serves under the /api context path.
    # Mirrors the Vite dev-server proxy in vite.config.js.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # index.html must never be cached, otherwise clients keep loading a stale
    # bundle hash after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA history fallback: unknown paths render client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
